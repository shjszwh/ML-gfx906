name: Strata DeepSeek V4.1 gfx906 build

# Builds the Strata image that carries the DeepSeek V4.1 Flash engine
# (strata/preset.deepseek41-rocm-10.1.sh). The preset is a local shell snippet
# that CI never reads, so every value it sets is repeated in env below.
# The daily Qwen workflow (strata-build.yaml) is left untouched.

on:
  push:
    branches:
      - strata-deepseek41
  workflow_dispatch:
    inputs:
      strata_tag:
        description: "Strata branch to build (empty = gfx906-dsv41; STRATA_COMMIT stays pinned)"
        required: false
        default: ""
      force_build:
        description: "Rebuild even if the image is already published"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build Strata DeepSeek V4.1 (ROCm 10.1)
    runs-on: ubuntu-latest
    env:
      STRATA_REPO: "https://github.com/shjszwh/mi50-Strata.git"
      STRATA_ROCM_VERSION: "10.1"
      # Falls back to the pinned branch for push events, where inputs is empty.
      STRATA_BRANCH: "${{ inputs.strata_tag || 'gfx906-dsv41' }}"
      STRATA_COMMIT: "9898718423ed1f319730fc65bac9a11a17c49988"
      STRATA_PATCH: "empty.patch"
      STRATA_BUILD_DSV41: "1"
      STRATA_PRESET_NAME: "deepseek41-rocm-10.1"
      # The preset does not set this, and the verified MI50 build ran without
      # it, so it stays empty to reproduce that build exactly.
      STRATA_CMAKE_HIP_FLAGS: ""
      # Keep test builds on the "-pre" tag path even if someone dispatches
      # this workflow at a tagged ref.
      STRATA_IS_RELEASE: "0"
      STRATA_FORCE_BUILD: "${{ inputs.force_build && '1' || '0' }}"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ vars.BUILD_REF || github.ref_name }}
          fetch-depth: 0

      - name: Install yq
        uses: ./.github/workflows/actions/install-yq-action

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Select registry and log in
        id: registry
        uses: ./.github/workflows/actions/registry-login
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve build parameters
        env:
          REGISTRY_ROOT: "${{ steps.registry.outputs.registry_root }}"
        run: |
          source ./.build/git-common.sh
          if [ "$STRATA_BRANCH" == "" ]; then
            echo "STRATA_BRANCH is empty." >&2
            exit 1
          fi
          : "${REPO_GIT_REF:="$(git_get_current_ref)"}"
          : "${STRATA_IS_RELEASE:="0"}"
          : "${STRATA_IMAGE:="$REGISTRY_ROOT/strata-gfx906"}"
          : "${STRATA_BASE_IMAGE:="docker.io/mixa3607/rocm-gfx906:$STRATA_ROCM_VERSION-complete"}"
          : "${STRATA_PRESET_NAME:="deepseek41-rocm-$STRATA_ROCM_VERSION"}"

          echo "REPO_GIT_REF=$REPO_GIT_REF"             >> "$GITHUB_ENV"
          echo "STRATA_IMAGE=$STRATA_IMAGE"             >> "$GITHUB_ENV"
          echo "STRATA_IS_RELEASE=$STRATA_IS_RELEASE"   >> "$GITHUB_ENV"
          echo "STRATA_BRANCH=$STRATA_BRANCH"           >> "$GITHUB_ENV"
          echo "STRATA_PRESET_NAME=$STRATA_PRESET_NAME" >> "$GITHUB_ENV"
          echo "STRATA_BASE_IMAGE=$STRATA_BASE_IMAGE"   >> "$GITHUB_ENV"

      - name: Check build
        id: check
        run: |
          needed="$(./strata/build-and-push.image.sh check)"
          echo "needed=$needed" >> "$GITHUB_OUTPUT"

      - name: Check base images
        if: steps.check.outputs.needed == 'true'
        run: |
          source ./.build/build-common.sh
          build_require_images "$STRATA_BASE_IMAGE"

      - name: Aggressive cleanup
        if: steps.check.outputs.needed == 'true'
        uses: ./.github/workflows/actions/cleanup-space-action

      - name: Build Strata DeepSeek V4.1 image
        if: steps.check.outputs.needed == 'true'
        run: ./strata/build-and-push.image.sh build
